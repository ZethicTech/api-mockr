name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
        os: [ubuntu-latest]
        include:
          # Hot reload leans on file watching, which behaves differently per
          # platform, so the supported range is checked on all three.
          - node: '22'
            os: macos-latest
          - node: '22'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # The published package is dist only. This fails loudly if source, tests
      # or the demo project ever leak into the tarball.
      - name: Check the tarball holds only dist
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const stray = files.filter(f =>
              !f.startsWith('dist/') &&
              !['package.json', 'README.md', 'LICENSE'].includes(f)
            );
            if (stray.length) {
              console.error('Unexpected files in the package:\n  ' + stray.join('\n  '));
              process.exit(1);
            }
            console.log('Package contains ' + files.length + ' files, all expected.');
          "
